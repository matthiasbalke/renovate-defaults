name: Test Renovate configuration

on:
  pull_request:
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "bun.lock"
      - "package.json"
      - "validate.sh"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "bun.lock"
      - "package.json"
      - "validate.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-renovate-configs:
    name: Validate and dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages and installed dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate configuration
        run: bun run validate:renovate:config

      - name: Point test config at this commit
        env:
          PRESET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PRESET_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PRESET="github>${PRESET_REPOSITORY}:default.jsonc#${PRESET_REVISION}"
          sed "s|github>matthiasbalke/renovate-defaults:default.jsonc|${PRESET}|" \
            .github/renovate.jsonc > "${RUNNER_TEMP}/renovate.jsonc"
          mv "${RUNNER_TEMP}/renovate.jsonc" .github/renovate.jsonc
          grep -Fq "${PRESET}" .github/renovate.jsonc

      - name: Test extended configuration
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: bun run test:renovate:config
