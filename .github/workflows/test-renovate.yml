name: Test Renovate configuration

on:
  pull_request:
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "package.json"
      - "validate.sh"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "package.json"
      - "validate.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate configuration
        run: bun run validate

      - name: Point test config at this commit
        env:
          PRESET: "github>${{ github.repository }}#${{ github.sha }}"
        run: |
          sed "s|github>matthiasbalke/renovate-defaults|${PRESET}|" \
            .github/renovate.jsonc > "${RUNNER_TEMP}/renovate.jsonc"
          mv "${RUNNER_TEMP}/renovate.jsonc" .github/renovate.jsonc
          grep -Fq "${PRESET}" .github/renovate.jsonc

      - name: Test extended configuration
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: bunx renovate@44.46.0 --platform=local --dry-run=lookup
