name: Test Renovate configuration

on:
  pull_request:
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "package.json"
      - "validate.sh"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.jsonc"
      - ".github/workflows/test-renovate.yml"
      - "default.jsonc"
      - "package.json"
      - "validate.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bunx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
          restore-keys: |
            bunx-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate configuration
        run: bun run validate

      - name: Point test config at this commit
        env:
          PRESET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PRESET_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PRESET="github>${PRESET_REPOSITORY}:default.jsonc#${PRESET_REVISION}"
          sed "s|github>matthiasbalke/renovate-defaults:default.jsonc|${PRESET}|" \
            .github/renovate.jsonc > "${RUNNER_TEMP}/renovate.jsonc"
          mv "${RUNNER_TEMP}/renovate.jsonc" .github/renovate.jsonc
          grep -Fq "${PRESET}" .github/renovate.jsonc

      - name: Test extended configuration
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: bunx renovate@44.46.0 --platform=local --dry-run=lookup
